name: Desktop app

# Dựng ứng dụng desktop (Linux: AppImage + deb, Windows: trình cài đặt .exe) khi tạo tag vX.Y.Z hoặc chạy tay.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Build web UI
        working-directory: app/frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Build server bundle (PyInstaller)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e app/backend pyinstaller
          pyinstaller --noconfirm --distpath app/desktop/build --workpath app/desktop/build/work app/desktop/argus-server.spec

      - name: Smoke test the bundled server
        shell: bash
        run: python app/desktop/smoke_test.py app/desktop/build/argus-server

      - name: Package desktop app
        working-directory: app/desktop
        run: |
          npm ci --no-fund --no-audit || npm install --no-fund --no-audit
          npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: argus-desktop-${{ matrix.os }}
          path: |
            app/desktop/dist/*.AppImage
            app/desktop/dist/*.deb
            app/desktop/dist/*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/desktop/dist/*.AppImage
            app/desktop/dist/*.deb
            app/desktop/dist/*.exe

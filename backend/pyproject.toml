[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-agent"
version = "0.3.0"
description = "Argus Agent: personal AI agent gateway with web UI, CLI, skills, MCP and Telegram"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "tranvanhuy-hichan"}]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pyyaml>=6",
  "croniter>=2",
  "mcp>=2,<3",
  "pypdf>=4",
  "openpyxl>=3.1",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
keyring = ["keyring>=24"]  # luu khoa chu vao keychain cua he dieu hanh

[project.scripts]
argus = "argus.cli:main"

[tool.setuptools.packages.find]
include = ["argus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
